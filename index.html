<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080D17"><meta name="description" content="Your personal L1 SOC Analyst learning and progress mentor.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png">
<title>SOC MENTOR</title>
<style>
:root{
  color-scheme:dark;
  --bg:#080D17;--surface:#111A2A;--raised:#172338;--raised2:#1b2a40;
  --primary:#3B82F6;--cyan:#22D3EE;--success:#10B981;--warning:#F59E0B;--danger:#EF4444;
  --text:#F1F5F9;--muted:#94A3B8;--line:#263449;--soft:#0c1422;
  --shadow:0 14px 34px rgba(0,0,0,.22);--radius:18px;
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg);scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 0 calc(86px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.topbar{position:sticky;top:0;z-index:20;height:66px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:rgba(8,13,23,.94);border-bottom:1px solid rgba(148,163,184,.12);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:11px;font-size:16px;font-weight:800;letter-spacing:.3px}
.brand-mark{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#19365c,#10233c);border:1px solid #31517b;color:#60a5fa;font-size:19px}
.brand small{display:block;color:var(--muted);font-size:9px;font-weight:650;letter-spacing:1.25px;margin-top:2px}
.top-actions{display:flex;align-items:center;gap:9px}
.icon-btn{width:38px;height:38px;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:16px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#1b2b42;border:1px solid #344a66;color:#dbeafe;font-size:12px;font-weight:800}
main{width:min(100%,760px);margin:0 auto;padding:18px 16px 26px}
.hero{padding:10px 2px 16px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;color:#7dd3fc;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
h1{font-size:26px;line-height:1.16;letter-spacing:-.65px;margin:8px 0 7px;font-weight:780}
h2{font-size:17px;line-height:1.25;margin:0;font-weight:740;letter-spacing:-.2px}
h3{font-size:14px;line-height:1.3;margin:0 0 7px;font-weight:720}
p{line-height:1.5}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:linear-gradient(145deg,#121e30,#101a29)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:5px}
.pill{display:inline-flex;align-items:center;gap:6px;width:max-content;max-width:100%;padding:5px 9px;border-radius:999px;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.28);color:#93c5fd;font-size:10px;font-weight:750;letter-spacing:.25px}
.pill.cyan{background:rgba(34,211,238,.09);border-color:rgba(34,211,238,.22);color:#67e8f9}
.pill.green{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.25);color:#6ee7b7}
.progress{height:8px;background:#26364b;border-radius:999px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--cyan));box-shadow:0 0 12px rgba(34,211,238,.2)}
.progress-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:11px}
.hero-banner{position:relative;overflow:hidden;background:radial-gradient(ellipse at 90% 5%,rgba(37,99,235,.2),transparent 45%),linear-gradient(145deg,#14253d,#101a2b 70%);border:1px solid #2b405d;border-radius:20px;padding:17px;margin:10px 0 14px}
.hero-banner:after{content:"";position:absolute;width:150px;height:150px;border:1px solid rgba(96,165,250,.12);border-radius:50%;right:-55px;top:-60px;box-shadow:0 0 0 18px rgba(96,165,250,.025),0 0 0 38px rgba(96,165,250,.02);pointer-events:none}
.hero-banner>*{position:relative;z-index:1}
.day-chip{display:inline-flex;align-items:center;gap:7px;padding:8px 10px;background:#0b1728;border:1px solid #345276;border-radius:11px;color:#bfdbfe;font-size:11px;font-weight:750}
.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0}
.metric{padding:13px 10px;text-align:left;min-width:0}
.metric-icon{font-size:16px;margin-bottom:9px;color:#7dd3fc}
.metric strong{display:block;font-size:21px;line-height:1.1;letter-spacing:-.5px}
.metric span{display:block;margin-top:5px;font-size:10px;line-height:1.3;color:var(--muted)}
.focus-card{background:linear-gradient(145deg,#14253a,#111b2b);border-color:#304663}
.focus-title{font-size:18px;margin:8px 0 5px}
.focus-list{display:grid;gap:9px;margin:14px 0}
.focus-item{display:flex;align-items:center;gap:9px;color:#dbeafe;font-size:12px}
.focus-item .dot{width:25px;height:25px;display:grid;place-items:center;border-radius:8px;background:#1c3552;color:#7dd3fc;font-size:12px;flex:0 0 auto}
button,.btn{border:1px solid transparent;border-radius:12px;padding:12px 15px;background:var(--primary);color:white;font-size:13px;font-weight:750;width:100%;text-align:center;min-height:44px;transition:transform .15s ease,background .15s ease,border-color .15s ease}
button:active{transform:scale(.985)}
button.primary{background:linear-gradient(110deg,#2563eb,#3b82f6);box-shadow:0 5px 16px rgba(37,99,235,.18)}
button.secondary{background:#192a41;border-color:#30445f;color:#dbeafe}
button.ghost{background:transparent;border-color:var(--line);color:var(--muted)}
button:disabled{opacity:.45;cursor:not-allowed}
.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.quick-card{display:flex;flex-direction:column;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.quick-icon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#1b3554;color:#7dd3fc;font-size:16px}
.quick-card p{margin:0;color:var(--muted);font-size:11px;line-height:1.4}
.quick-card button{margin-top:auto}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 2px 10px}
.section-head h2{font-size:16px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(10,16,27,.96);border-top:1px solid rgba(148,163,184,.16);backdrop-filter:blur(20px)}
.nav button{min-height:52px;padding:5px 2px 4px;background:transparent;border:0;color:#8292a8;font-size:10px;font-weight:650;border-radius:12px}
.nav button b{display:block;font-size:18px;line-height:1.1;margin-bottom:4px;font-weight:500}
.nav button.active{background:rgba(59,130,246,.15);color:#93c5fd}
.nav button.active b{color:#60a5fa}
.phase-card{padding:0;overflow:hidden}
.phase-head{padding:15px 15px 13px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.phase-number{width:30px;height:30px;flex:0 0 auto;display:grid;place-items:center;border-radius:10px;background:#1d3553;color:#93c5fd;font-size:12px;font-weight:800}
.phase-info{flex:1;min-width:0}
.phase-info h2{font-size:15px}
.phase-topics{padding:0 15px 14px}
.topic-row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid rgba(148,163,184,.1)}
.topic-mark{width:23px;height:23px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;background:#1b2c42;color:#8db9f7;font-size:11px}
.topic-row b{font-size:12px;font-weight:650}
.topic-row .small{margin-top:3px;line-height:1.4}
.current-phase{border-color:#3974b9;box-shadow:0 0 0 1px rgba(59,130,246,.12),var(--shadow)}
.current-phase .phase-number{background:#2563eb;color:white}
.timeline-note{padding:12px 13px;border-radius:13px;background:#101f32;border:1px solid #263b56;color:#cbd5e1;font-size:12px;line-height:1.45}
.hidden{display:none!important}
.notice{padding:12px 13px;border-radius:12px;background:#102b40;border:1px solid #245273;color:#cceeff;font-size:13px}
input,textarea,select{width:100%;background:#0b1422;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit;margin:6px 0 12px}
textarea{min-height:90px;resize:vertical}label{font-size:12px;color:var(--muted);font-weight:650}
.task{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px solid rgba(148,163,184,.12)}.task:last-child{border:0}.task input{width:19px;height:19px;margin:2px 0;accent-color:var(--cyan)}
.skill{margin:13px 0}.skill .row{font-size:13px}.skill select{max-width:145px;padding:8px;font-size:12px}
.choice{display:block;width:100%;text-align:left;margin:8px 0;background:#10283d;border:1px solid var(--line);color:var(--text);font-weight:550}.choice.selected{border-color:var(--cyan);background:#0d3651}
footer{text-align:center;color:var(--muted);font-size:10px;padding:20px}
@media(min-width:650px){main{padding:24px 22px 32px}.hero h1{font-size:31px}.metric-grid{gap:12px}.metric{padding:16px}.hero-banner{padding:21px}}
@media(max-width:360px){main{padding-left:12px;padding-right:12px}h1{font-size:23px}.metric strong{font-size:18px}.metric{padding:11px 8px}.quick-grid{gap:8px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head>
<body>
<header class="topbar"><div class="brand"><div class="brand-mark">⬡</div><div>SOC MENTOR<small>ANALYST DEVELOPMENT</small></div></div><div class="top-actions"><button id="install" class="icon-btn" style="width:auto;padding:0 11px;font-size:11px" hidden>＋ Install</button><div class="avatar" id="topAvatar">AN</div></div></header>
<main id="app"></main>
<nav class="nav">
<button data-page="home" class="active"><b>⌂</b>Home</button>
<button data-page="learn"><b>▤</b>Learn</button>
<button data-page="practice"><b>⌕</b>Practice</button>
<button data-page="progress"><b>▥</b>Progress</button>
<button data-page="profile"><b>◉</b>Profile</button>
</nav>
<script>
const phases=[
{title:"Phase 1 — Technical Foundations",weeks:"Weeks 1–3",topics:["Networking fundamentals","Linux fundamentals","Windows fundamentals & logs"]},
{title:"Phase 2 — Security & Log Analysis",weeks:"Weeks 4–6",topics:["Security fundamentals","Common attack techniques","Log analysis & MITRE ATT&CK"]},
{title:"Phase 3 — SOC Operations & Tools",weeks:"Weeks 7–10",topics:["SOC workflow & alert triage","SIEM fundamentals","Network analysis & threat intelligence","Ticketing & incident documentation"]},
{title:"Phase 4 — Practical SOC Development",weeks:"Weeks 11–16",topics:["Incident investigation","Phishing investigation","Scripting & cloud basics","Threat hunting & interview readiness"]}
];
const skillNames=["Networking","Windows security","Linux security","Security fundamentals","Attack techniques","Log analysis","MITRE ATT&CK","Alert triage","SIEM","Network analysis","Threat intelligence","Incident response","Documentation","Scripting","Cloud security","Communication & reasoning"];
const levels=["Not started","Learning","Practicing","Competent","Proficient"];
const today=()=>new Date().toISOString().slice(0,10);
let data=JSON.parse(localStorage.getItem("socmentor")||"{}");
data.start=data.start||today();data.sessions=data.sessions||{};data.skills=data.skills||{};data.name=data.name||"Analyst";
function save(){localStorage.setItem("socmentor",JSON.stringify(data))}
function sessions(){return Object.values(data.sessions).sort((a,b)=>a.date.localeCompare(b.date))}
function dayNo(){return Math.max(1,Math.floor((new Date(today())-new Date(data.start))/86400000)+1)}
function average(){let s=sessions();return s.length?Math.round(s.reduce((a,x)=>a+x.score,0)/s.length):0}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shell(content){document.getElementById("app").innerHTML=content}
function nav(page){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));({home,learn,practice,progress,profile})[page]()}
function currentFocus(){
  const week=Math.min(16,Math.max(1,Math.ceil(dayNo()/7)));
  const map={
    1:["Networking fundamentals","Understand networks, IP and MAC addresses, packets, LAN/WAN, routers and switches."],
    2:["Networking for SOC","Explore TCP/UDP, DNS, HTTP/S, common ports and network traffic."],
    3:["Linux fundamentals","Learn the Linux filesystem, users, permissions, processes and essential commands."],
    4:["Windows fundamentals & logs","Understand Windows accounts, Event Viewer and common security events."],
    5:["Security fundamentals","Study the CIA triad, authentication, authorization and security controls."],
    6:["Common attack techniques","Recognize phishing, brute force, malware and suspicious behavior."],
    7:["Log analysis & MITRE ATT&CK","Read events, build timelines and map behavior to ATT&CK."],
    8:["SOC workflow & alert triage","Practice alert validation, prioritization and escalation."],
    9:["SIEM fundamentals","Understand log sources, searches, detections and dashboards."],
    10:["Network analysis & threat intelligence","Investigate traffic and enrich indicators using approved sources."],
    11:["Ticketing & incident documentation","Write clear evidence-based investigation notes."],
    12:["Incident investigation","Build an incident timeline and recommend containment steps."],
    13:["Phishing investigation","Inspect message headers, links, attachments and indicators safely."],
    14:["Scripting & cloud basics","Use beginner scripting and understand cloud security basics."],
    15:["Threat hunting","Develop hypotheses and search for suspicious patterns."],
    16:["Interview readiness","Review core SOC workflows and practice explaining investigations."]
  };
  return {week, title:map[week][0], description:map[week][1]};
}
function home(){
  const count=sessions().length,prog=Math.min(100,Math.round(count/112*100)),focus=currentFocus();
  const competent=Object.values(data.skills).filter(x=>x==="Competent"||x==="Proficient").length;
  const initials=(data.name||"Analyst").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();
  const todayRecord=data.sessions[today()];
  document.getElementById("topAvatar").textContent=initials||"AN";
  shell(`
  <section class="hero">
    <div class="eyebrow">● YOUR LEARNING COMMAND CENTER</div>
    <h1>Welcome back, ${esc(data.name)}.</h1>
    <div class="muted small">Build confidence through consistent, evidence-based practice.</div>
  </section>
  <section class="hero-banner">
    <div class="row">
      <div class="stack">
        <span class="pill cyan">16-WEEK DEVELOPMENT PLAN</span>
        <div style="font-size:25px;font-weight:800;letter-spacing:-.5px;margin-top:7px">Day ${Math.min(112,dayNo())} <span class="muted" style="font-size:14px;font-weight:550">/ 112</span></div>
        <div class="small muted">Beginner → Entry-level SOC Analyst</div>
      </div>
      <div class="day-chip">◷ Week ${focus.week} / 16</div>
    </div>
    <div class="progress"><i style="width:${prog}%"></i></div>
    <div class="progress-meta"><span>${count} learning sessions recorded</span><b style="color:#bfdbfe">${prog}%</b></div>
  </section>
  <div class="metric-grid">
    <div class="card metric"><div class="metric-icon">▣</div><strong>${count}</strong><span>Sessions logged</span></div>
    <div class="card metric"><div class="metric-icon">◉</div><strong>${count?average()+"%":"—"}</strong><span>Average score</span></div>
    <div class="card metric"><div class="metric-icon">◇</div><strong>${competent}</strong><span>Skills competent+</span></div>
  </div>
  <div class="section-head"><h2>Today's learning focus</h2><span class="pill">${todayRecord?"SESSION LOGGED":"WEEK "+focus.week}</span></div>
  <section class="card focus-card">
    <div class="row"><span class="eyebrow">CURRENT ROADMAP TOPIC</span><span style="color:#7dd3fc;font-size:19px">◎</span></div>
    <h2 class="focus-title">${focus.title}</h2>
    <p class="small muted" style="margin:0">${focus.description}</p>
    <div class="focus-list">
      <div class="focus-item"><span class="dot">▤</span><span>Study the core concepts (30–45 min)</span></div>
      <div class="focus-item"><span class="dot">⌕</span><span>Complete one safe practical activity</span></div>
      <div class="focus-item"><span class="dot">✓</span><span>Test your understanding and record results</span></div>
    </div>
    <button class="primary" onclick="nav('learn')">${todayRecord?"Review your roadmap":"Continue today's learning"} →</button>
  </section>
  <div class="section-head"><h2>Quick actions</h2><span class="small muted">Pick up where you left off</span></div>
  <div class="quick-grid">
    <div class="quick-card"><div class="quick-icon">▤</div><div><h3>Learning roadmap</h3><p>Explore phases, weekly topics and objectives.</p></div><button class="secondary" onclick="nav('learn')">Open roadmap →</button></div>
    <div class="quick-card"><div class="quick-icon">⌕</div><div><h3>Practice lab</h3><p>Investigate a synthetic SOC alert.</p></div><button class="secondary" onclick="nav('practice')">Start practice →</button></div>
  </div>
  <div class="notice" style="margin-top:14px">Your learning records are stored on this device. Export a backup from Profile regularly. Reminders remain unconfigured.</div>`);
}
function learn(){
  const focus=currentFocus();
  const total=sessions().length,prog=Math.min(100,Math.round(total/112*100));
  const phaseDescriptions=[
    "Build the technical foundation every SOC analyst needs.",
    "Understand threats, security principles and how to read evidence.",
    "Learn the tools and workflows used in day-to-day SOC operations.",
    "Apply your knowledge through investigations and job-readiness practice."
  ];
  shell(`
  <section class="hero">
    <div class="eyebrow">YOUR DEVELOPMENT PATH</div>
    <h1>16-week SOC Analyst roadmap</h1>
    <p class="muted small" style="margin:0">A structured 112-day journey. Learn at a sustainable pace and use evidence—not the calendar—to measure mastery.</p>
  </section>
  <section class="card flat">
    <div class="row">
      <div class="stack"><span class="small muted">OVERALL LEARNING PROGRESS</span><h2>${total} / 112 sessions recorded</h2></div>
      <span class="pill">${prog}%</span>
    </div>
    <div class="progress"><i style="width:${prog}%"></i></div>
    <div class="progress-meta"><span>Current position: Week ${focus.week}</span><span>16 weeks</span></div>
  </section>
  <div class="section-head"><h2>Learning phases</h2><span class="small muted">4 phases · 16 weeks</span></div>
  ${phases.map((p,i)=>{
    const isCurrent=(focus.week>=([1,4,7,11][i])&&focus.week<=([3,6,10,16][i]));
    return `<section class="card phase-card ${isCurrent?"current-phase":""}">
      <div class="phase-head">
        <div class="phase-number">${String(i+1).padStart(2,"0")}</div>
        <div class="phase-info">
          <div class="row" style="justify-content:flex-start;flex-wrap:wrap;margin-bottom:5px"><span class="pill ${isCurrent?"cyan":""}">${p.weeks}</span>${isCurrent?'<span class="pill green">CURRENT PHASE</span>':''}</div>
          <h2>${p.title.replace(/^Phase \d+ — /,"")}</h2>
          <div class="small muted" style="margin-top:5px">${phaseDescriptions[i]}</div>
        </div>
      </div>
      <div class="phase-topics">
        ${p.topics.map((t,j)=>`<div class="topic-row"><div class="topic-mark">${i===0&&j===0?"▶":"•"}</div><div><b>${t}</b><div class="small muted">${i===0&&j===0?"Start here: learn network basics, addressing, packets and common devices.":"Understand the concepts, explain them clearly, then reinforce them with questions and a practical activity."}</div></div></div>`).join("")}
      </div>
    </section>`;
  }).join("")}
  <div class="timeline-note"><b style="color:#bfdbfe">Mentor rule:</b> The current week is a suggested learning position, not an automatic completion badge. Record sessions and demonstrate understanding before raising skill mastery.</div>
  <section class="card">
    <h2>Ready to record your learning?</h2>
    <p class="small muted">After completing a session, enter your knowledge, practical, reasoning and documentation scores in Progress.</p>
    <button class="primary" onclick="nav('progress')">Open progress tracker →</button>
  </section>`);
}
function practice(){shell(`<div class="hero"><div class="eyebrow">PRACTICE LAB</div><h1>Daily SOC challenge</h1><p class="muted">Start with evidence-based reasoning. This is a synthetic training scenario.</p></div>
<div class="card"><span class="pill">BEGINNER · AUTHENTICATION</span><h2 style="margin-top:12px">Multiple failed logins</h2><p>A sample alert reports 18 failed login attempts for one account within 4 minutes, followed by one successful login from the same source IP.</p><h3>What should an L1 analyst do first?</h3>
<div id="choices"><button class="choice" onclick="answer(0)">A. Immediately declare a confirmed breach and shut down the server.</button><button class="choice" onclick="answer(1)">B. Validate the alert and examine account, source IP, timestamps, and surrounding authentication events.</button><button class="choice" onclick="answer(2)">C. Ignore it because a successful login means the user is legitimate.</button><button class="choice" onclick="answer(3)">D. Delete the failed login records to reduce noise.</button></div><div id="feedback" class="notice hidden"></div></div>
<div class="card"><h2>Investigation checklist</h2>${["Confirm alert time range and affected account","Review source IP and geolocation/reputation using approved tools","Check whether the successful login was expected","Look for MFA events and other suspicious activity","Document evidence, uncertainty and recommended escalation"].map(x=>`<div class="task"><input type="checkbox"><div class="small">${x}</div></div>`).join("")}<p class="small muted">Use synthetic logs or an authorized lab. Never investigate systems without permission.</p></div>`)}
function answer(n){let f=document.getElementById("feedback");f.classList.remove("hidden");if(n===1){f.innerHTML="<b>Correct.</b> Validate and scope the alert first. Preserve evidence, build a timeline, check whether the successful login is suspicious, then follow the playbook and escalate based on evidence."}else{f.innerHTML="<b>Not quite.</b> The safest first step is to validate and scope the alert. Avoid jumping to conclusions, ignoring it, or altering evidence. Correct option: B."}}
function progress(){let s=sessions(),avg=average(),prog=Math.min(100,Math.round(s.length/112*100));shell(`<div class="hero"><div class="eyebrow">PERFORMANCE</div><h1>Your progress</h1><p class="muted">Your data stays in this browser on this device.</p></div>
<div class="card"><div class="row"><div><h2>Roadmap completion</h2><div class="muted small">${s.length} of 112 sessions recorded</div></div><b style="font-size:25px">${prog}%</b></div><div class="progress"><i style="width:${prog}%"></i></div></div>
<div class="stats"><div class="card metric"><strong>${avg||"—"}${s.length?"%":""}</strong><span>Average score</span></div><div class="card metric"><strong>${s.reduce((a,x)=>a+x.minutes,0)}</strong><span>Minutes learned</span></div><div class="card metric"><strong>${s.filter(x=>x.practical>=70).length}</strong><span>Practical passes</span></div></div>
<div class="card"><h2>Record a daily session</h2><form id="record"><label>Date</label><input type="date" name="date" value="${today()}" required><label>Topic</label><input name="topic" value="Day ${dayNo()} — Networking Fundamentals" required><label>Minutes studied</label><input name="minutes" type="number" min="0" max="240" value="50"><label>Knowledge / quiz score (0–100)</label><input name="knowledge" type="number" min="0" max="100" value="0" required><label>Practical investigation score (0–100)</label><input name="practical" type="number" min="0" max="100" value="0" required><label>Reasoning score (0–100)</label><input name="reasoning" type="number" min="0" max="100" value="0" required><label>Documentation / communication score (0–100)</label><input name="docs" type="number" min="0" max="100" value="0" required><label>What did you learn?</label><textarea name="notes" placeholder="Explain in your own words..."></textarea><label>Mistakes / weak areas</label><textarea name="weakness" placeholder="What was difficult?"></textarea><label>Next session focus</label><input name="next" placeholder="e.g. IPv4 addressing and subnet masks"><button type="submit">Save session</button></form><div id="saved" class="notice hidden"></div></div>
<div class="card"><h2>Session history</h2>${s.length?s.slice().reverse().map(x=>`<div class="task"><div>📅</div><div style="flex:1"><b>${esc(x.topic)}</b><div class="small muted">${x.date} · ${x.minutes} min · ${x.score}%</div></div></div>`).join(""):'<p class="muted small">No sessions yet. Your first report will appear here.</p>'}</div>`);
document.getElementById("record").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),q=+f.get("knowledge"),p=+f.get("practical"),r=+f.get("reasoning"),d=+f.get("docs"),score=Math.round(q*.45+p*.30+r*.15+d*.10);data.sessions[f.get("date")]={date:f.get("date"),topic:f.get("topic"),minutes:+f.get("minutes"),knowledge:q,practical:p,reasoning:r,docs:d,score,notes:f.get("notes"),weakness:f.get("weakness"),next:f.get("next")};save();document.getElementById("saved").classList.remove("hidden");document.getElementById("saved").innerHTML=`Saved successfully. Weighted score: <b>${score}%</b>. ${score<70?"Revise and reassess before advancing.":score<80?"Continue with targeted revision.":"Good progress; revisit older skills with spaced practice."}`;setTimeout(progress,1200)}
}
function profile(){shell(`<div class="hero"><div class="eyebrow">PROFILE & SETTINGS</div><h1>Your learning profile</h1></div><div class="card"><label>Your name / preferred label</label><input id="name" value="${esc(data.name)}"><button onclick="data.name=document.getElementById('name').value.trim()||'Analyst';save();home()">Save profile</button></div>
<div class="card"><h2>Skill mastery</h2><p class="small muted">Only raise a skill level when you have quiz or lab evidence.</p>${skillNames.map(n=>`<div class="skill"><div class="row"><b>${n}</b><select onchange="data.skills['${n}']=this.value;save()"><option ${(!data.skills[n]||data.skills[n]==="Not started")?"selected":""}>Not started</option>${levels.slice(1).map(l=>`<option ${data.skills[n]===l?"selected":""}>${l}</option>`).join("")}</select></div></div>`).join("")}</div>
<div class="card"><h2>Backup & restore</h2><p class="small muted">Export a backup regularly so you can move your progress to another device.</p><button onclick="exportData()">Export progress backup</button><label style="display:block;margin-top:14px">Restore backup file</label><input type="file" id="restore" accept="application/json"><button class="secondary" onclick="restoreData()">Restore selected backup</button></div>
<div class="card"><h2>About SOC MENTOR</h2><p class="small muted">Beginner-first · 45–60 minutes/day · 16-week L1 SOC Analyst roadmap. Reminders are intentionally not configured yet.</p><button class="secondary" onclick="showMentor()">View mentor instructions</button><div id="mentorText" class="hidden"></div></div>
<div class="card"><button class="ghost" onclick="if(confirm('This will erase all local learning records. Export a backup first. Continue?')){localStorage.removeItem('socmentor');location.reload()}">Reset all local data</button></div>`)}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="soc-mentor-backup.json";a.click();URL.revokeObjectURL(a.href)}
function restoreData(){let file=document.getElementById("restore").files[0];if(!file)return alert("Choose a backup file first.");let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.sessions||!x.skills)throw Error();data=x;save();alert("Backup restored.");location.reload()}catch(e){alert("Invalid SOC Mentor backup file.")}};r.readAsText(file)}
function showMentor(){let t=document.getElementById("mentorText");t.classList.remove("hidden");t.innerHTML=`<p class="small">You are SOC MENTOR, my senior SOC Analyst mentor. Assume I am a beginner. Train me 45–60 minutes daily for entry-level L1 SOC readiness. Each session: review previous focus; teach one concept simply; ask 5–10 questions one at a time without revealing answers; assign one safe practical SOC scenario; grade with evidence; explain mistakes; end with a report and next focus. Score knowledge 45%, practical 30%, reasoning 15%, documentation 10%. Below 70% means targeted remediation. Require repeated evidence before marking skills competent. Use authorized labs and synthetic data only. Commands: Start today's SOC Mentor session; Weekly review; Mock SOC interview; Investigate this alert; Generate daily report.</p><button class="secondary" onclick="navigator.clipboard.writeText(document.querySelector('#mentorText p').innerText)">Copy mentor instructions</button>`}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>nav(b.dataset.page)));
nav("home");
let deferredPrompt;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;let b=document.getElementById("install");b.hidden=false;b.onclick=async()=>{deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;b.hidden=true}});
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
